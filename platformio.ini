; labelbee: ESP-IDF firmware for a network label printer: an ESP32-S3 drives a DYMO
; LabelManager PnP over USB host.
;
; Build system: PlatformIO with framework = espidf:
; espressif32 7.0.1 ships ESP-IDF 6.0.1 (package version "4.60001.0" encodes 6.00.01).
; Pinned to an exact version, never a floating tag: bump deliberately.

[platformio]
default_envs = labelbee

[env:labelbee]
platform = espressif32@7.0.1
framework = espidf
; ESP32-S3-N16R8 (DevKitC-1 clone): 16 MB quad flash, 8 MB octal PSRAM (see sdkconfig.defaults).
; The platform has no N16R8 board file, so the generic DevKitC-1 with the flash size raised.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; version_stamp.py configures again when the git version changed (the app descriptor's version);
; pack_www.py packs www/ into src/www_pack.bin + .S for the firmware to serve (see the scripts)
extra_scripts =
  pre:tools/version_stamp.py
  pre:tools/pack_www.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -std=gnu++20
  -Wall
  -Wextra
  -Wno-unused-parameter
  ; Designated initialisers zero-initialise the remaining members in C++20; we use
  ; that deliberately to survive ESP-IDF structs gaining fields between versions.
  -Wno-missing-field-initializers

build_unflags =
  -std=gnu++2b
  -std=gnu++17
